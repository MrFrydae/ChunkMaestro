name: Agent Skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  agent-skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Validate project skills
        run: python tooling/agents/check.py
      - name: Run guidance integrity regressions
        run: python -m unittest discover -s tooling/agents -p 'test_*.py' -v
