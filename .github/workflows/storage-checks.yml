name: Storage checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: storage-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: storage tests and coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Storage evidence contract regressions
        run: python -m unittest discover -s tooling/quality/storage -p 'test_*.py' -v
      - name: Full storage runtime tests and coverage (no mutation campaigns)
        timeout-minutes: 12
        run: python tooling/quality/storage/qualify.py check .artifacts/storage-checks/${{ matrix.os }}
      - name: Explain storage outcome and retained evidence
        if: ${{ !cancelled() }}
        run: python tooling/quality/storage/summary.py .artifacts/storage-checks/${{ matrix.os }}
      - name: Preserve coverage and failure logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-checks-${{ matrix.os }}
          path: .artifacts/storage-checks/${{ matrix.os }}/
          if-no-files-found: error
