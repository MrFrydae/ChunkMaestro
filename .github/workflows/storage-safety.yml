name: Storage safety
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Run additional Windows CPU and concurrency diagnostics
        type: boolean
        default: false
run-name: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'storage-qualify') && 'Storage qualification' || 'Storage qualification not requested' }}
permissions:
  contents: read
concurrency:
  group: storage-qualification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  windows-profile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
    name: Windows CPU profile (diagnostic only)
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Capture one unfiltered Windows suite with runtime CPU sampling
        timeout-minutes: 6
        run: python tooling/quality/storage/runtime_trace.py .artifacts/windows-profile
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-cpu-profile
          path: .artifacts/windows-profile/
          if-no-files-found: error
  windows-runtime:
    name: Windows concurrency experiment (diagnostic only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Compare unfiltered ordinary-suite concurrency
        timeout-minutes: 16
        run: python tooling/quality/storage/runtime_probe.py .artifacts/windows-runtime
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-runtime-diagnostic
          path: .artifacts/windows-runtime/
          if-no-files-found: error
  measure:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'storage-qualify' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Evidence contract regressions
        run: python -m unittest discover -s tooling/quality/storage -p 'test_*.py' -v
      - name: Coverage and Domain/Application mutation collection
        timeout-minutes: 105
        run: python tooling/quality/storage/qualify.py run .artifacts/storage/${{ matrix.os }}
      - name: Trusted private Persistence replay collection
        if: success()
        timeout-minutes: 225
        run: python tooling/quality/storage/replay_ci.py .artifacts/storage/${{ matrix.os }}
      - if: ${{ !cancelled() }}
        run: python tooling/quality/storage/volume.py .artifacts/storage/${{ matrix.os }}/volume
      - if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python tooling/quality/storage/native.py .artifacts/storage/${{ matrix.os }}/native
      - name: Explain storage outcome and retained evidence
        if: ${{ !cancelled() }}
        run: python tooling/quality/storage/summary.py .artifacts/storage/${{ matrix.os }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-${{ matrix.os }}
          include-hidden-files: true
          path: .artifacts/storage/${{ matrix.os }}/
          if-no-files-found: error
  gate:
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'storage-qualify') }}
    needs: measure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: storage-*
          path: .artifacts/storage/evidence
      - run: python tooling/quality/storage/qualify.py gate .artifacts/storage/evidence/storage-windows-2025 .artifacts/storage/evidence/storage-macos-15 --output .artifacts/storage/gate.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-safety-gate
          path: .artifacts/storage/gate.json
          if-no-files-found: error
