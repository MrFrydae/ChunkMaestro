name: CI
on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact committed workflow and source SHA (dispatch ref must resolve here)
        required: true
        type: string
      authorization:
        description: Owner decision token PR6-one-Windows-run (one deliberate run only)
        required: true
        type: string
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'normal' }}
  cancel-in-progress: true
jobs:
  managed:
    if: github.event_name != 'workflow_dispatch'
    name: managed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Build tooling regression checks
        run: python -m unittest discover -s tooling/build -p "test_*.py" -v
      - name: Requirements traceability and integrity regressions
        run: |
          python tooling/specification/check.py
          python -m unittest discover -s tooling/specification -p "test_*.py" -v
      - name: Release-only failing-suite regression
        run: python tooling/build/verify_release_discovery.py
      - name: Locked restore, Release build, format, tests when present
        run: python tooling/build/build.py verify
      - name: Brace policy negative fixtures
        run: python tooling/build/verify_brace_style.py
      - name: Preserve available managed test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-tests-${{ matrix.os }}
          path: |
            .artifacts/tests/
            .artifacts/build/
          if-no-files-found: warn
          retention-days: 14
  secret-scan:
    if: github.event_name != 'workflow_dispatch'
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify synthetic detection and redaction
        run: python tooling/build/verify_secret_scan.py
      - name: Scan history and tracked working files
        run: python tooling/build/build.py secret-scan
      - name: Preserve redacted scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secret-scan
          path: .artifacts/security/
          if-no-files-found: error
          retention-days: 14
  qa-evidence:
    name: qa-evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Validate lead-attested independent exact-head verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python tooling/build/qa_ci.py
      - name: Preserve QA verdict including blocked results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-qa-verdict
          path: .artifacts/qa/
          if-no-files-found: error
          retention-days: 30
  owner-windows-qualification:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'MrFrydae/ChunkMaestro' && github.actor_id == '38875853' && github.run_attempt == 1 && inputs.head == github.sha && inputs.authorization == 'PR6-one-Windows-run'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - timeout-minutes: 2
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - timeout-minutes: 2
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - timeout-minutes: 2
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Bounded exact-head collection (never qualification PASS)
        env:
          AUTHORIZED_HEAD: ${{ inputs.head }}
          OWNER_AUTHORIZATION: ${{ inputs.authorization }}
        run: python -u tooling/quality/storage/hosted_windows.py "$env:RUNNER_TEMP/storage-windows-$env:GITHUB_RUN_ID" --head "$env:AUTHORIZED_HEAD" --authorization "$env:OWNER_AUTHORIZATION"
      - name: Retain raw and incomplete evidence without retry
        timeout-minutes: 4
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storage-windows-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-windows-${{ github.run_id }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
