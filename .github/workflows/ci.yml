name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  inspector-metadata:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, check: 'inspector-metadata (Linux)', artifact: inspector-metadata-linux, architecture: x86_64}
          - {runner: ubuntu-24.04-arm, check: 'inspector-metadata (Linux arm64)', artifact: inspector-metadata-linux-arm64, architecture: aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          # The candidate compatibility test compiles its pinned pre-candidate ABI.
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
      - name: Record actual unprivileged architecture and source identity
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -eu -o pipefail
          mkdir -p .artifacts/ci/inspector-metadata
          test "$(id -u)" != 0
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          { uname -a; id; cc --version; dotnet --info; git rev-parse HEAD; } > .artifacts/ci/inspector-metadata/environment.txt
          sha256sum src/ChunkMaestro.Inspector.Native/* tests/ChunkMaestro.InspectorNativeTests/* src/ChunkMaestro.PrivilegedHelper/*.cs tests/ChunkMaestro.HelperPolicyTests/*.cs > .artifacts/ci/inspector-metadata/source.sha256
          sha256sum tooling/ci/h1_profile.py tooling/ci/test_h1_profile.py tooling/ci/h1-profile-plan.json docs/qa/inspector-h1-profile.md .github/workflows/ci.yml >> .artifacts/ci/inspector-metadata/source.sha256
      - name: Unprivileged native kernel and separate syscall-control tests
        shell: bash
        run: |
          set -eu -o pipefail
          mkdir -p .artifacts/ci/inspector-metadata
          python tooling/ci/command.py --timeout-seconds 180 -- sh tests/ChunkMaestro.InspectorNativeTests/run.sh 2>&1 | tee .artifacts/ci/inspector-metadata/run.log
      - name: Standalone unprivileged session escrow controls and kernel cases
        timeout-minutes: 4
        shell: bash
        run: |
          set -eu -o pipefail
          mkdir -p .artifacts/ci/inspector-metadata/session-escrow
          python tooling/ci/command.py --timeout-seconds 180 -- sh tests/ChunkMaestro.InspectorNativeTests/run_session_escrow.sh --all 2>&1 | tee .artifacts/ci/inspector-metadata/session-escrow/run.log
      - name: Locked restore of policy test graph
        timeout-minutes: 3
        shell: bash
        run: |
          set -eu -o pipefail
          python tooling/ci/command.py --timeout-seconds 150 -- dotnet restore tests/ChunkMaestro.HelperPolicyTests/ChunkMaestro.HelperPolicyTests.csproj --locked-mode --force --no-cache 2>&1 | tee .artifacts/ci/inspector-metadata/restore.log
      - name: Build native test shim and managed policy boundary
        timeout-minutes: 3
        shell: bash
        run: |
          set -eu -o pipefail
          python tooling/ci/command.py --timeout-seconds 150 -- dotnet build tests/ChunkMaestro.HelperPolicyTests/ChunkMaestro.HelperPolicyTests.csproj -c Release --no-restore 2>&1 | tee .artifacts/ci/inspector-metadata/build.log
          sha256sum tests/ChunkMaestro.HelperPolicyTests/bin/Release/net10.0/libchunkmaestro_policy_snapshot_v1.so > .artifacts/ci/inspector-metadata/test-shim.sha256
      - name: Unprivileged candidate plain sanitizer and kernel controls
        timeout-minutes: 4
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/ci/inspector-metadata/agent-candidate
          python tooling/ci/command.py --timeout-seconds 180 -- sh tests/ChunkMaestro.InspectorNativeTests/run_agent_candidate.sh 2>&1 | tee .artifacts/ci/inspector-metadata/agent-candidate/run.log
      - name: Private accepted-connection owner plain sanitizer and kernel cases
        timeout-minutes: 4
        env:
          CM_N1_ARTIFACTS: ${{ github.workspace }}/.artifacts/ci/inspector-metadata/agent-connection-owner
        shell: bash
        run: |
          set -eu -o pipefail
          mkdir -p "$CM_N1_ARTIFACTS"
          python tooling/ci/command.py --timeout-seconds 180 -- /usr/bin/env CM_N1_ARTIFACTS="$CM_N1_ARTIFACTS" sh tests/ChunkMaestro.InspectorNativeTests/run_agent_connection_owner.sh 2>&1 | tee "$CM_N1_ARTIFACTS/supervisor.log"
      - name: Inspect exact additive escrow exports and binary provenance
        shell: bash
        run: |
          set -eu -o pipefail
          library=tests/ChunkMaestro.HelperPolicyTests/bin/Release/net10.0/libchunkmaestro_session_escrow_v1.so
          output=.artifacts/ci/inspector-metadata/session-escrow
          sha256sum "$library" > "$output/escrow-dso.sha256"
          readelf -h -d -V -Ws "$library" > "$output/escrow-dso.elf.txt"
          nm -D --defined-only --extern-only --format=posix "$library" > "$output/escrow-dso.symbols.txt"
          # Every defined dynamic export must be a strong text symbol; do not
          # silently drop weak, IFUNC, object or other unexpected export types.
          awk 'NF < 2 || $2 != "T" {exit 1} {print $1}' "$output/escrow-dso.symbols.txt" | LC_ALL=C sort > "$output/exports.actual"
          printf '%s\n' cm_agent_candidate_acquire_v1 cm_agent_candidate_measure_unqualified_v1 cm_agent_candidate_close_v1 cm_escrow_bind cm_escrow_close cm_escrow_error cm_escrow_handback cm_escrow_measure_original_v1 cm_escrow_metadata cm_escrow_observe cm_escrow_upload | LC_ALL=C sort > "$output/exports.expected"
          diff -u "$output/exports.expected" "$output/exports.actual"
          if grep -F cm_control_ "$output/escrow-dso.symbols.txt"; then exit 1; fi
      - name: Execute Linux ownership, cancellation and private handoff cases
        if: matrix.architecture == 'x86_64'
        timeout-minutes: 3
        shell: bash
        run: |
          set -eu -o pipefail
          python tooling/ci/command.py --timeout-seconds 150 -- dotnet test tests/ChunkMaestro.HelperPolicyTests/ChunkMaestro.HelperPolicyTests.csproj -c Release --no-build --no-restore --collect "XPlat Code Coverage" --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/inspector-metadata/managed 2>&1 | tee .artifacts/ci/inspector-metadata/managed.log
      - name: Direct pinned xUnit ARM execution with no skipped cases
        if: matrix.architecture == 'aarch64'
        timeout-minutes: 3
        shell: bash
        run: |
          set -eu -o pipefail
          mkdir -p .artifacts/ci/inspector-metadata/managed
          assembly=tests/ChunkMaestro.HelperPolicyTests/bin/Release/net10.0/ChunkMaestro.HelperPolicyTests.dll
          results=.artifacts/ci/inspector-metadata/managed
          # Keep machine JSON separate from supervisor headings/cleanup diagnostics.
          python tooling/ci/command.py --timeout-seconds 30 -- /bin/sh -c 'exec dotnet "$1" -preEnumerateTheories -noColor -list full/json > "$2"' policy-discovery "$assembly" "$results/discovery.json" > "$results/discovery-supervisor.log"
          python tooling/ci/command.py --timeout-seconds 120 -- dotnet "$assembly" -preEnumerateTheories -failSkips -noColor -xml "$results/results.xml" -trx "$results/results.trx" -ctrf "$results/results.ctrf.json" 2>&1 | tee .artifacts/ci/inspector-metadata/managed.log
          python tooling/ci/policy_runner.py "$results"
      - name: Collect unqualified native H1 prerequisite profile
        timeout-minutes: 2
        shell: bash
        run: |
          set -eu -o pipefail
          mkdir -p .artifacts/ci/inspector-metadata/h1-profile-parent
          python tooling/ci/command.py --timeout-seconds 100 -- python -B tooling/ci/h1_profile.py --output .artifacts/ci/inspector-metadata/h1-profile-parent/profile --architecture '${{ matrix.architecture }}' --sdk-root /usr/share/dotnet 2>&1 | tee .artifacts/ci/inspector-metadata/h1-profile-parent/supervisor.log
      - name: Retain native diagnostics including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: |
            .artifacts/ci/inspector-metadata
            .artifacts/policy-snapshot
          if-no-files-found: error
          retention-days: 14

  agent-skills:
    name: agent-skills
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Repository guidance, requirements and CI contracts
        run: |
          python tooling/agents/check.py
          python -m unittest discover -s tooling/agents -p "test_*.py" -v
          python tooling/specification/check.py
          python -m unittest discover -s tooling/specification -p "test_*.py" -v
          python -m unittest discover -s tooling/build -p "test_*.py" -v
          python -m unittest discover -s tooling/ci -p "test_*.py" -v
          python tooling/ci/command.py --timeout-seconds 30 -- python -B -m unittest discover -s tooling/inspector-qualification -p "test_*.py" -v
      - name: Retain real Linux self-context diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inspector-context-linux
          path: .artifacts/ci/inspector-context
          if-no-files-found: warn
          retention-days: 14

  managed:
    name: managed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Keep required check/artifact names stable; select hardware separately.
        include:
          - {os: ubuntu-24.04, runner: ubuntu-24.04}
          - {os: windows-2025, runner: windows-2025}
          - {os: macos-15, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Pinned SDK and locked restore
        timeout-minutes: 4
        run: python tooling/ci/command.py -- python tooling/build/build.py restore
      - name: Owner qualification offline cancellation and no-window contracts
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/ci/owner-fixture-offline
          python tooling/ci/command.py --timeout-seconds 60 -- /usr/bin/env GITHUB_ACTIONS=true python -B -m unittest discover -s tooling/owner-qualification -p 'test_*.py' -v 2>&1 | tee .artifacts/ci/owner-fixture-offline/run.log
      - name: Release build and generated-inclusive brace/type policy
        timeout-minutes: 4
        run: python tooling/ci/command.py -- python tooling/build/build.py build
      - name: Formatting
        timeout-minutes: 3
        run: python tooling/ci/command.py -- python tooling/build/build.py format
      - name: Unsupported controller contract on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: python tooling/ci/command.py -- dotnet test tests/ChunkMaestro.PersistenceTests/ChunkMaestro.PersistenceTests.csproj -c Release --no-build --no-restore --blame-hang --blame-hang-timeout 60s --logger trx --results-directory .artifacts/ci/linux-tests
      - name: C# policy negative and valid controls (shard 1 of 3)
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- python tooling/build/verify_brace_style.py --shard 1
      - name: C# policy negative and valid controls (shard 2 of 3)
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- python tooling/build/verify_brace_style.py --shard 2
      - name: C# policy negative and valid controls (shard 3 of 3)
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- python tooling/build/verify_brace_style.py --shard 3
      - name: Release-discovery negative control
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- python tooling/build/verify_release_discovery.py
      - name: Native desktop headless contracts
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- dotnet test tests/ChunkMaestro.AvaloniaHeadlessTests/ChunkMaestro.AvaloniaHeadlessTests.csproj -c Release --no-build --no-restore --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/desktop-tests
      - name: Protected credential native and refusal contracts
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- dotnet test tests/ChunkMaestro.CredentialsTests/ChunkMaestro.CredentialsTests.csproj -c Release --no-build --no-restore --collect "XPlat Code Coverage" --settings tooling/quality/credentials/coverage.runsettings --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/credential-tests
      - name: Controller CA profile and self-signature contracts
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- dotnet test tests/ChunkMaestro.ControllerIdentityTests/ChunkMaestro.ControllerIdentityTests.csproj -c Release --no-build --no-restore --collect "XPlat Code Coverage" --settings tooling/quality/controller-identity/coverage.runsettings --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/identity-tests
      - name: Inspection protocol contracts
        timeout-minutes: 2
        run: python tooling/ci/command.py --timeout-seconds 90 -- dotnet test tests/ChunkMaestro.ContractsTests/ChunkMaestro.ContractsTests.csproj -c Release --no-build --no-restore --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/contract-tests
      - name: Inspection policy DATA boundaries and malformed-input corpus
        timeout-minutes: 2
        run: python tooling/ci/command.py --timeout-seconds 90 -- dotnet test tests/ChunkMaestro.HelperPolicyTests/ChunkMaestro.HelperPolicyTests.csproj -c Release --no-build --no-restore --collect "XPlat Code Coverage" --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/helper-policy-tests
      - name: Internal owner bridge no-prompt and platform refusal contracts
        timeout-minutes: 2
        run: python tooling/ci/command.py --timeout-seconds 90 -- dotnet test tests/ChunkMaestro.OwnerVerificationTests/ChunkMaestro.OwnerVerificationTests.csproj -c Release --no-build --no-restore --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/owner-tests
      - name: Retain build and Linux test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-${{ matrix.os }}
          path: |
            .artifacts/ci/linux-tests
            .artifacts/ci/desktop-tests
            .artifacts/ci/credential-tests
            .artifacts/ci/identity-tests
            .artifacts/ci/contract-tests
            .artifacts/ci/helper-policy-tests
            .artifacts/ci/owner-tests
            .artifacts/ci/owner-fixture-offline
            .artifacts/build
          if-no-files-found: warn
          retention-days: 14

  storage:
    name: storage / ${{ matrix.system }} / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, system: Windows, group: inventory}
          - {os: windows-2025, system: Windows, group: integrity}
          - {os: windows-2025, system: Windows, group: identity-integrity}
          - {os: windows-2025, system: Windows, group: recovery}
          - {os: windows-2025, system: Windows, group: authority}
          - {os: macos-15-intel, system: Darwin, group: inventory}
          - {os: macos-15-intel, system: Darwin, group: integrity}
          - {os: macos-15-intel, system: Darwin, group: identity-integrity}
          - {os: macos-15-intel, system: Darwin, group: recovery}
          - {os: macos-15-intel, system: Darwin, group: authority}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      STORAGE_GROUP: ${{ matrix.group }}
      STORAGE_SYSTEM: ${{ matrix.system }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Locked storage restore
        timeout-minutes: 3
        run: python tooling/ci/command.py -- dotnet restore tests/ChunkMaestro.PersistenceTests/ChunkMaestro.PersistenceTests.csproj --locked-mode
      - name: Build this test partition once
        timeout-minutes: 3
        run: python tooling/ci/command.py -- dotnet build tests/ChunkMaestro.PersistenceTests/ChunkMaestro.PersistenceTests.csproj -c Release --no-restore
      - name: Direct corruption, crash, recovery and authority tests
        timeout-minutes: 4
        run: |
          $filter = python tooling/ci/storage.py filter --group $env:STORAGE_GROUP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tooling/ci/command.py --timeout-seconds 45 -- python tooling/ci/discover.py --group $env:STORAGE_GROUP --output .artifacts/ci/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tooling/ci/command.py --timeout-seconds 150 -- dotnet test tests/ChunkMaestro.PersistenceTests/ChunkMaestro.PersistenceTests.csproj -c Release --no-build --no-restore --filter "$filter" --collect "XPlat Code Coverage" --settings tooling/quality/storage/coverage.runsettings --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/tests
      - name: Validate actual executed cases and preserve failure result
        if: always()
        timeout-minutes: 1
        run: python tooling/ci/storage.py record --group $env:STORAGE_GROUP --system $env:STORAGE_SYSTEM --head $env:GITHUB_SHA --results .artifacts/ci/tests
      - name: Retain TRX, coverage and hang diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-${{ matrix.system }}-${{ matrix.group }}
          path: .artifacts/ci/tests
          if-no-files-found: error
          retention-days: 14

  volume:
    name: storage / ${{ matrix.system }} / disk-full
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, system: Windows}
          - {os: macos-15-intel, system: Darwin}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Isolated 64 MiB image, bounded disk-full and recovery case
        timeout-minutes: 5
        run: python tooling/ci/command.py -- python tooling/ci/volume.py .artifacts/ci/volume
      - name: Retain raw execution and mount/cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: volume-${{ matrix.system }}
          path: .artifacts/ci/volume
          if-no-files-found: error
          retention-days: 14

  native:
    name: storage / Darwin / native authority
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Compile and test real filesystem and injected OS failure paths
        timeout-minutes: 3
        run: python tooling/ci/command.py -- python tooling/ci/native.py .artifacts/ci/native
      - name: Retain native assertions and LLVM coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-Darwin
          path: .artifacts/ci/native
          if-no-files-found: error
          retention-days: 14

  storage-safety:
    name: storage-safety
    needs: [storage, volume, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: .artifacts/ci/downloads
      - name: Validate raw platform execution and coverage
        if: always()
        env:
          SAFETY_JOBS: ${{ toJSON(needs) }}
        run: python tooling/ci/gate.py .artifacts/ci/downloads --head "$GITHUB_SHA" --jobs "$SAFETY_JOBS" --output .artifacts/ci/storage-verdict.json
      - name: Retain machine-readable safety verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-verdict
          path: .artifacts/ci/storage-verdict.json
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify redaction and scan history/working tree
        run: |
          python tooling/build/verify_secret_scan.py
          python tooling/build/build.py secret-scan
      - name: Retain redacted scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-scan
          path: .artifacts/security
          if-no-files-found: error
          retention-days: 14

  qa-evidence:
    name: qa-evidence
    needs: [storage-safety, inspector-metadata]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Independent QA and same-workflow safety outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          STORAGE_SAFETY_RESULT: ${{ needs.storage-safety.result }}
          INSPECTOR_METADATA_RESULT: ${{ needs.inspector-metadata.result }}
        run: python tooling/build/qa_ci.py
      - name: Retain independent QA verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-qa-verdict
          path: .artifacts/qa/verdict.json
          if-no-files-found: error
          retention-days: 14
