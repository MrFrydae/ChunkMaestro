name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  agent-skills:
    name: agent-skills
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Repository guidance, requirements and CI contracts
        run: |
          python tooling/agents/check.py
          python -m unittest discover -s tooling/agents -p "test_*.py" -v
          python tooling/specification/check.py
          python -m unittest discover -s tooling/specification -p "test_*.py" -v
          python -m unittest discover -s tooling/build -p "test_*.py" -v
          python -m unittest discover -s tooling/ci -p "test_*.py" -v

  managed:
    name: managed (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Keep required check/artifact names stable; select hardware separately.
        include:
          - {os: ubuntu-24.04, runner: ubuntu-24.04}
          - {os: windows-2025, runner: windows-2025}
          - {os: macos-15, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Pinned SDK and locked restore
        timeout-minutes: 4
        run: python tooling/ci/command.py -- python tooling/build/build.py restore
      - name: Release build and generated-inclusive brace/type policy
        timeout-minutes: 4
        run: python tooling/ci/command.py -- python tooling/build/build.py build
      - name: Formatting
        timeout-minutes: 3
        run: python tooling/ci/command.py -- python tooling/build/build.py format
      - name: Unsupported controller contract on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: python tooling/ci/command.py -- dotnet test tests/ChunkMaestro.PersistenceTests/ChunkMaestro.PersistenceTests.csproj -c Release --no-build --no-restore --blame-hang --blame-hang-timeout 60s --logger trx --results-directory .artifacts/ci/linux-tests
      - name: Formatter and Release-discovery negative controls
        timeout-minutes: 3
        run: |
          python tooling/build/verify_brace_style.py
          python tooling/build/verify_release_discovery.py
      - name: Native desktop headless contracts
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- dotnet test tests/ChunkMaestro.AvaloniaHeadlessTests/ChunkMaestro.AvaloniaHeadlessTests.csproj -c Release --no-build --no-restore --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/desktop-tests
      - name: Protected credential native and refusal contracts
        timeout-minutes: 3
        run: python tooling/ci/command.py --timeout-seconds 150 -- dotnet test tests/ChunkMaestro.CredentialsTests/ChunkMaestro.CredentialsTests.csproj -c Release --no-build --no-restore --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/credential-tests
      - name: Retain build and Linux test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-${{ matrix.os }}
          path: |
            .artifacts/ci/linux-tests
            .artifacts/ci/desktop-tests
            .artifacts/ci/credential-tests
            .artifacts/build
          if-no-files-found: warn
          retention-days: 14

  storage:
    name: storage / ${{ matrix.system }} / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, system: Windows, group: inventory}
          - {os: windows-2025, system: Windows, group: integrity}
          - {os: windows-2025, system: Windows, group: recovery}
          - {os: windows-2025, system: Windows, group: authority}
          - {os: macos-15-intel, system: Darwin, group: inventory}
          - {os: macos-15-intel, system: Darwin, group: integrity}
          - {os: macos-15-intel, system: Darwin, group: recovery}
          - {os: macos-15-intel, system: Darwin, group: authority}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      STORAGE_GROUP: ${{ matrix.group }}
      STORAGE_SYSTEM: ${{ matrix.system }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Locked storage restore
        timeout-minutes: 3
        run: python tooling/ci/command.py -- dotnet restore tests/ChunkMaestro.PersistenceTests/ChunkMaestro.PersistenceTests.csproj --locked-mode
      - name: Build this test partition once
        timeout-minutes: 3
        run: python tooling/ci/command.py -- dotnet build tests/ChunkMaestro.PersistenceTests/ChunkMaestro.PersistenceTests.csproj -c Release --no-restore
      - name: Direct corruption, crash, recovery and authority tests
        timeout-minutes: 4
        run: |
          $filter = python tooling/ci/storage.py filter --group $env:STORAGE_GROUP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tooling/ci/command.py --timeout-seconds 45 -- python tooling/ci/discover.py --group $env:STORAGE_GROUP --output .artifacts/ci/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tooling/ci/command.py --timeout-seconds 150 -- dotnet test tests/ChunkMaestro.PersistenceTests/ChunkMaestro.PersistenceTests.csproj -c Release --no-build --no-restore --filter "$filter" --collect "XPlat Code Coverage" --settings tooling/quality/storage/coverage.runsettings --blame-hang --blame-hang-timeout 60s --logger trx --logger "console;verbosity=normal" --results-directory .artifacts/ci/tests
      - name: Validate actual executed cases and preserve failure result
        if: always()
        timeout-minutes: 1
        run: python tooling/ci/storage.py record --group $env:STORAGE_GROUP --system $env:STORAGE_SYSTEM --head $env:GITHUB_SHA --results .artifacts/ci/tests
      - name: Retain TRX, coverage and hang diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-${{ matrix.system }}-${{ matrix.group }}
          path: .artifacts/ci/tests
          if-no-files-found: error
          retention-days: 14

  volume:
    name: storage / ${{ matrix.system }} / disk-full
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, system: Windows}
          - {os: macos-15-intel, system: Darwin}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Isolated 64 MiB image, bounded disk-full and recovery case
        timeout-minutes: 5
        run: python tooling/ci/command.py -- python tooling/ci/volume.py .artifacts/ci/volume
      - name: Retain raw execution and mount/cleanup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: volume-${{ matrix.system }}
          path: .artifacts/ci/volume
          if-no-files-found: error
          retention-days: 14

  native:
    name: storage / Darwin / native authority
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Compile and test real filesystem and injected OS failure paths
        timeout-minutes: 3
        run: python tooling/ci/command.py -- python tooling/ci/native.py .artifacts/ci/native
      - name: Retain native assertions and LLVM coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-Darwin
          path: .artifacts/ci/native
          if-no-files-found: error
          retention-days: 14

  storage-safety:
    name: storage-safety
    needs: [storage, volume, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: .artifacts/ci/downloads
      - name: Validate raw platform execution and coverage
        if: always()
        env:
          SAFETY_JOBS: ${{ toJSON(needs) }}
        run: python tooling/ci/gate.py .artifacts/ci/downloads --head "$GITHUB_SHA" --jobs "$SAFETY_JOBS" --output .artifacts/ci/storage-verdict.json
      - name: Retain machine-readable safety verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-verdict
          path: .artifacts/ci/storage-verdict.json
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify redaction and scan history/working tree
        run: |
          python tooling/build/verify_secret_scan.py
          python tooling/build/build.py secret-scan
      - name: Retain redacted scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-scan
          path: .artifacts/security
          if-no-files-found: error
          retention-days: 14

  qa-evidence:
    name: qa-evidence
    needs: storage-safety
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Independent QA and same-workflow storage outcome
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          STORAGE_SAFETY_RESULT: ${{ needs.storage-safety.result }}
        run: python tooling/build/qa_ci.py
      - name: Retain independent QA verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-qa-verdict
          path: .artifacts/qa/verdict.json
          if-no-files-found: error
          retention-days: 14
