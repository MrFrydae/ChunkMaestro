name: Debian fixture
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - 'tooling/debian-fixture/**'
      - '.github/workflows/debian-fixture.yml'
      - 'docs/operations/debian-fixture.md'
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'Enter RUN-SYNTHETIC-DEBIAN-13 after reviewing fixture scope and unsigned upstream checksum provenance'
        required: true
        type: string
permissions:
  contents: read
jobs:
  offline:
    name: Debian fixture offline contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tooling/debian-fixture -p 'test_*.py' -v
  fixture:
    name: Debian fixture owner-reviewed smoke
    needs: offline
    # A dedicated label event permits a reviewed premerge run. An existing label
    # never grants execution on a later push, reopen or unrelated label event.
    if: >-
      github.repository == 'MrFrydae/ChunkMaestro' && github.actor_id == '38875853' &&
      ((github.event_name == 'workflow_dispatch' && inputs.acknowledge == 'RUN-SYNTHETIC-DEBIAN-13') ||
       (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
        github.event.label.name == 'run-debian-fixture' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      group: debian-fixture
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5, same reviewed baseline as repository CI
        with:
          persist-credentials: false
      - name: Offline contracts
        run: python3 -B -m unittest discover -s tooling/debian-fixture -p 'test_*.py' -v
      - name: Bind reviewed setup inputs
        run: |
          mkdir -m 700 "$RUNNER_TEMP/debian-fixture-evidence"
          sha256sum tooling/debian-fixture/*.py tooling/debian-fixture/image.json tooling/debian-fixture/SHA512SUMS .github/workflows/debian-fixture.yml > "$RUNNER_TEMP/debian-fixture-evidence/inputs.sha256"
      - name: Read-only prerequisite inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tooling/debian-fixture/runner_setup.py inventory | tee "$RUNNER_TEMP/debian-fixture-evidence/inventory.jsonl"
      - name: Fixed official Ubuntu runner dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tooling/debian-fixture/runner_setup.py setup | tee "$RUNNER_TEMP/debian-fixture-evidence/setup.jsonl"
      - name: Nonroot post-setup prerequisites
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tooling/debian-fixture/runner_setup.py check | tee "$RUNNER_TEMP/debian-fixture-evidence/post-setup.jsonl"
      - name: Fixed TCG Debian system-emulation smoke
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C /usr/bin/python3 -B tooling/debian-fixture/fixture.py --execute-owner-reviewed-fixture 2>&1 | tee "$RUNNER_TEMP/debian-fixture-evidence/status.jsonl"
      - name: Upload fixed sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, repository baseline
        with:
          name: debian-fixture-sanitized
          path: |
            ${{ runner.temp }}/debian-fixture-evidence/inputs.sha256
            ${{ runner.temp }}/debian-fixture-evidence/inventory.jsonl
            ${{ runner.temp }}/debian-fixture-evidence/setup.jsonl
            ${{ runner.temp }}/debian-fixture-evidence/post-setup.jsonl
            ${{ runner.temp }}/debian-fixture-evidence/status.jsonl
          if-no-files-found: warn
          retention-days: 7
